name: Rotate profile footer quote

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rotating-profile-quote
  cancel-in-progress: true

jobs:
  rotate-quote:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate the current quote banner
        run: python scripts/update_quote.py

      - name: Commit updated banner when it changes
        run: |
          if git diff --quiet -- assets/rotating-quote.svg; then
            echo "Quote banner is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/rotating-quote.svg
          git commit -m "chore: rotate profile footer quote"
          git push
