name: Rotate profile footer quote

on:
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rotating-profile-quote
  cancel-in-progress: false

jobs:
  rotate-quote:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate quote and refresh image cache key
        run: python scripts/update_quote.py

      - name: Commit quote and README cache key
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/rotating-quote.svg README.md
          if git diff --cached --quiet; then
            echo "Quote is already current."
            exit 0
          fi
          git commit -m "chore: rotate profile quote and refresh cache"
          git push origin HEAD:main
