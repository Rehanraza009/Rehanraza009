name: Update GitHub Contribution Streak

on:
  schedule:
    - cron: "30 3 * * *" # Daily at 09:00 Asia/Kolkata
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/streak-stats.yml"

permissions:
  contents: write

jobs:
  update-streak:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Prepare streak image directory
        run: mkdir -p profile

      - name: Generate contribution streak SVG
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&theme=tokyonight&hide_border=true&timezone=Asia/Kolkata&mode=daily&card_width=600&card_height=195&disable_animations=true
          path: profile/streak.svg

      - name: Commit updated streak card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git diff --cached --quiet || (git commit -m "Update GitHub contribution streak" && git push)
