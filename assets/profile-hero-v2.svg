<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Rehan Raza | Data Science, AI and Software Development</title>
  <desc id="desc">A midnight indigo and violet developer hero banner with an abstract analytics dashboard, code symbols and electric blue accents. Visually distinct from the green IIRS geospatial course card.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080B18"/>
      <stop offset=".52" stop-color="#171638"/>
      <stop offset="1" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset=".55" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <radialGradient id="glow" cx="55%" cy="50%" r="55%">
      <stop offset="0" stop-color="#6366F1" stop-opacity=".34"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="25" height="25" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#C7D2FE" fill-opacity=".14"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#020617" flood-opacity=".45"/>
    </filter>
    <clipPath id="clip"><rect width="1200" height="300" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#dots)"/>
    <circle cx="1000" cy="142" r="270" fill="url(#glow)"/>
    <path d="M760 0H880L730 300H610Z" fill="#818CF8" opacity=".045"/>
    <path d="M900 0H955L805 300H750Z" fill="#38BDF8" opacity=".04"/>

    <!-- Developer / analytics dashboard: deliberately not a satellite or globe motif -->
    <g transform="translate(825 37)" filter="url(#shadow)">
      <rect width="315" height="218" rx="18" fill="#11152B" stroke="#818CF8" stroke-opacity=".55"/>
      <path d="M0 44H315" stroke="#64748B" stroke-opacity=".32"/>
      <circle cx="21" cy="22" r="4" fill="#F472B6"/>
      <circle cx="37" cy="22" r="4" fill="#818CF8"/>
      <circle cx="53" cy="22" r="4" fill="#38BDF8"/>
      <text x="75" y="26" fill="#CBD5E1" font-family="Arial,Helvetica,sans-serif" font-size="10" letter-spacing="1.3">INSIGHTS / OVERVIEW</text>
      <g transform="translate(18 62)">
        <rect width="150" height="135" rx="10" fill="#1A2040" stroke="#64748B" stroke-opacity=".35"/>
        <text x="13" y="20" fill="#A5B4FC" font-family="Arial,Helvetica,sans-serif" font-size="9" letter-spacing="1">DATA TREND</text>
        <path d="M13 105H136M13 77H136M13 49H136" stroke="#94A3B8" stroke-opacity=".16" stroke-dasharray="3 5"/>
        <path d="M14 94L37 80L57 87L78 55L98 65L118 36L136 43" fill="none" stroke="url(#accent)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="118" cy="36" r="4" fill="#38BDF8"/>
        <circle cx="78" cy="55" r="3.5" fill="#A5B4FC"/>
        <text x="13" y="124" fill="#94A3B8" font-family="monospace" font-size="8">ANALYTICS / ML</text>
      </g>
      <g transform="translate(182 62)">
        <rect width="115" height="135" rx="10" fill="#1A2040" stroke="#64748B" stroke-opacity=".35"/>
        <text x="12" y="20" fill="#A5B4FC" font-family="Arial,Helvetica,sans-serif" font-size="9" letter-spacing=".7">TECH STACK</text>
        <rect x="12" y="36" width="90" height="9" rx="4.5" fill="#30385C"/>
        <rect x="12" y="36" width="70" height="9" rx="4.5" fill="#38BDF8"/>
        <rect x="12" y="57" width="90" height="9" rx="4.5" fill="#30385C"/>
        <rect x="12" y="57" width="55" height="9" rx="4.5" fill="#818CF8"/>
        <rect x="12" y="78" width="90" height="9" rx="4.5" fill="#30385C"/>
        <rect x="12" y="78" width="79" height="9" rx="4.5" fill="#F472B6"/>
        <text x="12" y="112" fill="#CBD5E1" font-family="monospace" font-size="9">PY  /  SQL</text>
      </g>
    </g>

    <!-- Code glyph and connected nodes -->
    <g transform="translate(755 82)" font-family="monospace" font-size="24" font-weight="700" fill="#A5B4FC" opacity=".75">
      <text x="0" y="0">&lt;/&gt;</text>
    </g>
    <g transform="translate(770 243)" fill="none" stroke-linecap="round" opacity=".8">
      <path d="M0 0L48-21L101-4L152-38L210-19L263-52" stroke="url(#accent)" stroke-width="2"/>
      <circle cx="0" cy="0" r="4" fill="#38BDF8" stroke="none"/>
      <circle cx="48" cy="-21" r="4" fill="#A5B4FC" stroke="none"/>
      <circle cx="101" cy="-4" r="4" fill="#F472B6" stroke="none"/>
      <circle cx="152" cy="-38" r="4" fill="#38BDF8" stroke="none"/>
      <circle cx="210" cy="-19" r="4" fill="#A5B4FC" stroke="none"/>
      <circle cx="263" cy="-52" r="4" fill="#F472B6" stroke="none"/>
    </g>

    <rect x="44" y="38" width="182" height="30" rx="15" fill="#242052" stroke="#818CF8" stroke-opacity=".9"/>
    <circle cx="61" cy="53" r="4" fill="#38BDF8"/>
    <text x="75" y="57" fill="#E0E7FF" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="1.6">DEVELOPER PROFILE</text>
    <text x="44" y="145" fill="#F8FAFC" font-family="Arial,Helvetica,sans-serif" font-size="67" font-weight="800" letter-spacing="1">REHAN RAZA</text>
    <rect x="46" y="166" width="120" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="44" y="207" fill="#E0E7FF" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" letter-spacing=".6">DATA SCIENCE  /  AI &amp; ML  /  SOFTWARE DEVELOPMENT</text>
    <text x="45" y="248" fill="#A5B4FC" font-family="Arial,Helvetica,sans-serif" font-size="15">From data to insights. From ideas to applications.</text>
  </g>
  <rect x="1" y="1" width="1198" height="298" rx="24" fill="none" stroke="#818CF8" stroke-opacity=".55" stroke-width="2"/>
</svg>