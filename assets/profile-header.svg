<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Rehan Raza — Data Science, AI/ML and Software Development</title>
  <desc id="desc">A modern dark graphite and emerald portfolio banner with data-inspired geometric elements.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07110D"/>
      <stop offset=".48" stop-color="#0B2E22"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6EE7B7" stop-opacity="0"/>
      <stop offset=".55" stop-color="#6EE7B7" stop-opacity=".24"/>
      <stop offset="1" stop-color="#FBBF24" stop-opacity=".22"/>
    </linearGradient>
    <radialGradient id="orb">
      <stop offset="0" stop-color="#34D399" stop-opacity=".38"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#D1FAE5" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <clipPath id="clip"><rect width="1200" height="300" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <circle cx="970" cy="140" r="270" fill="url(#orb)"/>
    <path d="M0 246C220 190 300 320 540 250S875 190 1200 245" fill="none" stroke="#6EE7B7" stroke-opacity=".18" stroke-width="2"/>
    <path d="M0 270C240 213 340 340 600 272S920 220 1200 265" fill="none" stroke="#FBBF24" stroke-opacity=".16" stroke-width="1.5"/>
    <g transform="translate(850 38)" fill="none" stroke-linecap="round">
      <circle cx="150" cy="105" r="92" stroke="#A7F3D0" stroke-opacity=".32" stroke-width="1.5"/>
      <circle cx="150" cy="105" r="67" stroke="#FDE68A" stroke-opacity=".48" stroke-width="1.5" stroke-dasharray="4 8"/>
      <circle cx="150" cy="105" r="42" stroke="#6EE7B7" stroke-opacity=".55" stroke-width="2"/>
      <path d="M150 12V198M57 105H243M84 39L216 171M216 39L84 171" stroke="#D1FAE5" stroke-opacity=".24"/>
      <path d="M150 105L225 60L274 84" stroke="#FBBF24" stroke-width="2.5"/>
      <path d="M150 105L85 155L28 132" stroke="#6EE7B7" stroke-width="2.5"/>
      <circle cx="150" cy="105" r="8" fill="#FBBF24" stroke="none"/>
      <circle cx="225" cy="60" r="5" fill="#6EE7B7" stroke="none"/>
      <circle cx="85" cy="155" r="5" fill="#A7F3D0" stroke="none"/>
      <circle cx="274" cy="84" r="4" fill="#FBBF24" stroke="none"/>
      <circle cx="28" cy="132" r="4" fill="#6EE7B7" stroke="none"/>
    </g>
    <g transform="translate(42 38)">
      <rect width="190" height="30" rx="15" fill="#064E3B" stroke="#6EE7B7" stroke-opacity=".7"/>
      <circle cx="17" cy="15" r="4" fill="#FBBF24"/>
      <text x="31" y="20" fill="#D1FAE5" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="2">DEVELOPER PROFILE</text>
    </g>
    <text x="42" y="143" fill="#F8FAFC" font-family="Arial,Helvetica,sans-serif" font-size="66" font-weight="800" letter-spacing="1">REHAN RAZA</text>
    <rect x="44" y="164" width="94" height="4" rx="2" fill="#FBBF24"/>
    <text x="42" y="204" fill="#D1FAE5" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="600" letter-spacing="1">DATA SCIENCE  /  AI &amp; ML  /  SOFTWARE DEVELOPMENT</text>
    <text x="43" y="246" fill="#A7F3D0" font-family="Arial,Helvetica,sans-serif" font-size="15" letter-spacing=".4">Turning analytical thinking into practical technology.</text>
  </g>
  <rect x="1" y="1" width="1198" height="298" rx="24" fill="none" stroke="#6EE7B7" stroke-opacity=".35" stroke-width="2"/>
</svg>